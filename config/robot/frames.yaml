# B 좌표 기준 (단위: m, 각도: rad)
#
# 근거: simulation/worlds/sort_cell.sdf, simulation/models/conveyor_belt·sort_bin_*/model.sdf,
#       simulation/models/ur5e_2f85/link_camera.urdf.xacro
# - W(작업 좌표) = Gazebo 월드 = ROS TF `world`. 로봇 바닥(base_link)이 원점이라 숫자가 같다.
#   X: 로봇 → 벨트(앞), Y: 로봇 기준 왼쪽, Z: 위.
# - B 내부 계산은 m. C·D로 내보낼 때만 B가 한 번 mm로 바꾼다 (B 협업 요청 §6 DB-01·DB-02).
# - 월드 파일의 배치를 바꾸면 이 파일도 같이 고친다.

world:
  frame_id: world
  output_frame_id: base_link       # B → C 목표의 기준 좌표 (DB-02 결정 2)

belt:
  center: [0.55, 0]
  length: 1.26                     # 모델 <size> 1번째, 90° 돌려서 Y 방향
  width: 0.20                      # 모델 <size> 2번째
  top_z: 0.100                     # 0.090 (판 가운데) + 0.020 / 2
  direction: [0.0, 1.0]            # -Y → +Y
  speed_mps: null                  # C 설정값 (C 답 C-5). B는 보내지 않는다

# 부품 윤곽을 볼 높이 = 벨트 위 5 mm (실습 4단계: 오차 1~3 mm). part_specs.json의 plane_z와 같다
part_plane_z: 0.105

bins:
  BOLT_A: {center: [0.72, -0.05], yaw: 1.5708, size: [0.160, 0.120, 0.080]}  # 2026-11-17 벨트 건너편으로 (팔 회전·거리 단축), A·B 간격 6 cm
  BOLT_B: {center: [0.72, 0.17], yaw: 1.5708, size: [0.160, 0.120, 0.080]}
  NUT:    {center: [0.55, 0.70], yaw: 0.0,    size: [0.160, 0.120, 0.080]}   # 벨트 끝(y 0.63) 바로 뒤

place:
  height_above_bin: 0.10           # 상자 윗면 위 10 cm에서 놓기 → z = 0.08 + 0.10 = 0.18 (DB-02 결정 7)

# 집는 구간 (B 결정 2026-11-17, C 합의 「B 계산·C 확인」). 부품 중심 y가 이 밖이면 B는 목표를 보내지 않는다(SKIP OUT_OF_REACH).
# 팔이 0.75 m 안에서 닿는 범위 |y| <= 0.51 (x 0.55)에서 여유를 뺐다. +0.45를 지난 볼트는 포기(C 답).
pick_zone:
  y_min: -0.45
  y_max: 0.45

# 목표 유효기간 (C-9, B 제안 2026-11-20). valid_until_ns = 촬영 시각 + goal_ttl_s (SIM_TIME ns).
# C는 실행 직전에 지금 시각이 이보다 늦으면 실행하지 않고 EXPIRED. null이면 0(안 정함)으로 보낸다.
goal_ttl_s: 2.0

# 높이 기준 (B 결정 2026-11-17, C 요청 CB-02). base_link 기준 z, m
heights:
  grasp: 0.105                     # 부품 윗면 = part_plane_z
  approach: 0.205                  # 부품 위 10 cm에서 내려감
  lift: 0.250                      # 집은 뒤 들어올림. 벨트(0.10)·상자(0.08) 위 15 cm 이상

cameras:
  link:                            # 운영(검출) 카메라. upper_arm_link에 고정 → 사진마다 TF를 다시 읽는다
    optical_frame: link_cam_optical_frame
    camera_info_topic: /link_cam/camera_info
    image_topic: /link_cam/image
    width: 1280
    height: 720
    horizontal_fov: 1.0
  gripper:                         # RGB-D. 현재 표시·확인용 (B 계산에는 아직 안 씀)
    optical_frame: gripper_cam_optical_frame
    camera_info_topic: /gripper_cam/camera_info
    image_topic: /gripper_cam/image
    width: 640
    height: 480
    horizontal_fov: 1.0471975512

robot:
  base_frame: base_link
  tool_frame: tool0                # 집게 가운데(G) → tool0 오프셋은 C가 적용 (CB-5, DB-02 결정 5)
  gripper: robotiq_2f85
  gripper_max_opening: 0.085
